[package]
name = "gnuclient-launcher"
version = "0.1.0"
edition = "2021"
description = "Luxurious launcher for GNUClient (Forge 1.8.9)"
authors = ["levkoren"]

[[bin]]
name = "gnuclient-launcher"
path = "src/main.rs"

[dependencies]
# GUI
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["chrono", "serde"] }

# Images (mod icons)
image = { version = "0.25", default-features = false, features = ["png"] }

# Async / network
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utility
dirs = "5"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
base64 = "0.22"
rand = "0.8"
async-trait = "0.1"
flate2 = "1"
tar = "0.4"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"

[dev-dependencies]
tempfile = "3"